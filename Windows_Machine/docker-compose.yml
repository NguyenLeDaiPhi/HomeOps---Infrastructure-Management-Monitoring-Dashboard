version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: homeops-postgres
    environment:
      POSTGRES_DB: homeops
      POSTGRES_USER: homeops
      POSTGRES_PASSWORD: homeops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U homeops -d homeops" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - homeops

  monitoring-server:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: monitoring-server
    env_file:
      - .env
      - ../Windows_Machine/.env
    ports:
      - "5003:5003" # TCP telemetry listener for Kali agent
    expose:
      - "8000" # internal WebSocket + HTTP API for dashboard
      - "8500" # internal Command Gateway REST API
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 5003)); s.close()\"" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - homeops

  frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: homeops-frontend
    expose:
      - "80"
    depends_on:
      monitoring-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - homeops

  nginx:
    image: nginx:stable-alpine
    container_name: homeops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      monitoring-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - homeops

volumes:
  postgres_data:

networks:
  homeops:
    driver: bridge
